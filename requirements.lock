# requirements.lock: exact versions for the Digitize Patches environment (Python 3.13).
#
# How it was made (2026-10-10):
#   1. `.venv/bin/python -m pip freeze` of the working development venv
#      (CPython 3.13.15, 53 packages). No editable or local-path lines were present.
#   2. `uv pip install rich questionary` into a scratch Python 3.13 venv that held
#      exactly those 53 packages. The additions below are the 7 packages that
#      install brought in: rich, questionary and their 5 dependencies. No existing
#      pin changed.
#   3. The result installs on a fresh Python 3.13 venv with
#      `uv pip install --no-deps -r requirements.lock` (the list is complete, so
#      dependency resolution is switched off; this also keeps inkex from pulling in
#      PyGObject, which needs a C compiler and is only used by the Inkscape GUI).
#
# Do not edit by hand. To change a version, install it in a scratch venv, rerun
# `python3 digitize.py doctor`, and regenerate this file the same way.
