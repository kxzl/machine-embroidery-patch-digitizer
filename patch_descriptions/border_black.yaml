# Shared border config for the DCC patch set (raster / Nano Banana PNG path).
#
# Why this exists: `--border-color` is an SVG-input flag only. `run.sh` drops it
# for raster inputs (run.sh:54), and the raster border colour is otherwise
# auto-sampled from the outer band (vectorize.py:353) — which on a light-field
# patch is the field colour itself, i.e. an invisible border. `force_black`
# overrides that with a solid black satin border.
#
# Usage: tools/digitize/run.sh --key-background --colors N --size-mm S \
#          --config patch_descriptions/border_black.yaml <image>
border:
  mode: "force_black"
